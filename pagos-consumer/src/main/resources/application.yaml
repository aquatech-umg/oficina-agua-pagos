spring:
  application:
    name: pagos-consumer
  config:
    # Lee el .env local (no se sube a Git): primero el de este módulo y luego el de la raíz del repo.
    # optional: si no existe, arranca igual. Las variables de la consola siguen teniendo prioridad.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:changeme}
    # Necesario para publicar en las colas de espera y en pagos.dlq con confirmación
    publisher-confirm-type: correlated
    listener:
      simple:
        prefetch: 1
  # Los simuladores rechazan campos opcionales en null (ej. payer.taxId): no se envían
  jackson:
    default-property-inclusion: non_null
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000

# Clientes Feign generados: name es obligatorio (el contextId lo usa por defecto)
bankPayments:
  name: bankPayments
  url: ${BANK_BASE_URL:https://gdsi5lyj34.execute-api.us-east-1.amazonaws.com/prod}
bankHealth:
  name: bankHealth
  url: ${BANK_BASE_URL:https://gdsi5lyj34.execute-api.us-east-1.amazonaws.com/prod}
erpPagos:
  name: erpPagos
  url: ${ERP_BASE_URL:https://gdsi5lyj34.execute-api.us-east-1.amazonaws.com/prod}
erpSalud:
  name: erpSalud
  url: ${ERP_BASE_URL:https://gdsi5lyj34.execute-api.us-east-1.amazonaws.com/prod}

bankpaymentssimulator:
  security:
    apiKeyAuth:
      key: ${BANK_API_KEY:}
erppaymentssimulator:
  security:
    apiKeyAuth:
      key: ${ERP_API_KEY:}

server:
  port: 8084