spring:
  application:
    name: pagos-consumer
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:changeme}
    publisher-confirm-type: correlated
    listener:
      simple:
        prefetch: 1
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000

bankPayments:
  name: bankPayments
  url: ${BANK_BASE_URL:https://gdsi5lyj34.execute-api.us-east-1.amazonaws.com/prod}
bankHealth:
  name: bankHealth
  url: ${BANK_BASE_URL:https://gdsi5lyj34.execute-api.us-east-1.amazonaws.com/prod}
erpPagos:
  name: erpPagos
  url: ${ERP_BASE_URL:https://gdsi5lyj34.execute-api.us-east-1.amazonaws.com/prod}
erpSalud:
  name: erpSalud
  url: ${ERP_BASE_URL:https://gdsi5lyj34.execute-api.us-east-1.amazonaws.com/prod}

bankpaymentssimulator:
  security:
    apiKeyAuth:
      key: ${BANK_API_KEY:}
erppaymentssimulator:
  security:
    apiKeyAuth:
      key: ${ERP_API_KEY:}

server:
  port: 8084
