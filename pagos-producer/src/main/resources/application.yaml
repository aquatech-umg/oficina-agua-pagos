spring:
  application:
    name: pagos-producer
  config:
    # Lee el .env local (no se sube a Git): primero el de este módulo y luego el de la raíz del repo.
    # optional: si no existe, arranca igual. Las variables de la consola siguen teniendo prioridad.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:changeme}
    # Obligatorio: sin esto waitForConfirmsOrDie falla y el producer no puede publicar con confirmación
    publisher-confirm-type: correlated

pagos:
  producer:
    intervalo-ms: 10000
    lote: 500

server:
  port: 8083